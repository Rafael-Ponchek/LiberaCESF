<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Administrador| Autoriza CESF</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
  body { background: #fff; min-height: 100vh; overflow-x: hidden; position: relative; display: flex; justify-content: center; }
  .onda-cima { position: fixed; top: -110px; right: -130px; width: 480px; max-width: 70vw; z-index: 0; pointer-events: none; mix-blend-mode: multiply; }
  .onda-baixo { position: fixed; bottom: -110px; left: -130px; width: 480px; max-width: 70vw; z-index: 0; pointer-events: none; mix-blend-mode: multiply; }
  .tela { width: 100%; max-width: 380px; padding: 24px 20px; text-align: center; position: relative; z-index: 1; }
  .logo-img { width: 190px; height: auto; margin: 10px auto 6px; display: block; }
  h1 { font-size: 26px; margin: 8px 0 14px; font-weight: bold; }
  .user-icon { width: 105px; height: 105px; margin: 0 auto 22px; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; }
  .user-wrap { position: relative; display: flex; justify-content: center; align-items: flex-end; width: 105px; height: 105px; }
  .user-icon .cabeca { width: 34px; height: 34px; border: 3px solid #111; border-radius: 50%; position: absolute; margin-bottom: 52px; background: transparent; }
  .user-icon .corpo { width: 70px; height: 38px; border: 3px solid #111; border-bottom: none; border-radius: 35px 35px 0 0; background: transparent; }
  form { text-align: left; }
  .campo { display: flex; align-items: center; border: 1px solid #000; border-radius: 2px; height: 58px; padding: 0 14px; margin-top: 20px; background: #fff; }
  .campo:focus-within { border-color: #9e1b1b; }
  .campo .icone { width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .campo .icone img { width: 38px; height: 38px; object-fit: contain; }
  .campo input { border: none; outline: none; flex: 1; font-size: 17px; font-weight: bold; text-align: center; background: transparent; }
  .campo input::placeholder { color: #111; font-weight: bold; }
  .btn-entrar { width: 88%; height: 52px; margin: 26px auto 0; display: block; background: #9e1b1b; color: #fff; border: none; border-radius: 10px; font-size: 18px; cursor: pointer; }
  .btn-entrar:hover { background: #7d1515; }
  .esqueceu { display: block; text-align: center; margin-top: 18px; color: #000; font-size: 15px; font-weight: bold; text-decoration: none; }
  #mensagem { text-align: center; margin-top: 12px; font-size: 14px; min-height: 18px; }
  .erro { color: #c00; } .ok { color: #0a7a2e; }
  @media (max-width: 600px) { .onda-cima, .onda-baixo { width: 320px; top: -80px; right: -90px; bottom: -80px; left: -90px; } }
</style>
</head>
<body>
<img src="onda.png" class="onda-cima" alt="">
<div class="tela">
  <img src="logo.png" alt="Logo Autoriza CESF" class="logo-img">
  <h1>Administrador</h1>
  <div class="user-icon">
    <div class="user-wrap">
      <div class="cabeca"></div>
      <div class="corpo"></div>
    </div>
  </div>
  <form id="form-login">
    <div class="campo">
      <span class="icone"><img src="img.envelope.png" alt="E-mail"></span>
      <input type="email" id="email" placeholder="E-mail">
    </div>
    <div class="campo">
      <span class="icone"><img src="img.cadeado.png" alt="Senha"></span>
      <input type="password" id="senha" placeholder="Senha">
    </div>
    <button type="submit" class="btn-entrar">Entrar</button>
    <p id="mensagem"></p>
  </form>
  <a href="#" class="esqueceu">Esqueceu a senha?</a>
</div>
<img src="onda2.png" class="onda-baixo" alt="">
<script>
  document.getElementById('form-login').addEventListener('submit', (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const senha = document.getElementById('senha').value;
    const msg = document.getElementById('mensagem');
    if (email === '' || senha === '') { msg.textContent = 'Preencha o e-mail e a senha.'; msg.className = 'erro'; }
    else { msg.textContent = 'Login feito!'; msg.className = 'ok'; }
  });
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nova Autorização - Autoriza CESF</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="pagina-autorizacao">

    <main class="celular">

        <!-- CABEÇALHO -->
        <header class="cabecalho">

            <img src="IMAGENS/logo.png"
                 alt="Logo Autoriza CESF"
                 class="logo">

        </header>

        <!-- CONTEÚDO -->
        <section class="conteudo">

            <h1>Autorização de saída</h1>

            <p class="descricao">
                Consulte e acompanhe as autorizações 
                emitidas pelos professores
            </p>




    



        <!-- BARRA DE PESQUISA -->
        <section class="pesquisa">

            <span class="menu">☰</span>

            <input
                type="text"
                placeholder="Digite o nome ou turma..."
                id="campoPesquisa"
            >

            <span class="lupa">⌕</span>

        </section>


        <!-- TABELAa -->
        <section class="container-tabela">

            <table class="tabela-autorizacoes">

                <thead>
                    <tr>
                        <th>Aluno</th>
                        <th>Turma</th>
                        <th>Destino</th>
                        <th>Hora</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="corpoTabela">

                    <tr>
                        <td>Maria S.</td>
                        <td>2°A</td>
                        <td>Banheiro</td>
                        <td>10:15</td>
                        <td>Fora agora</td>
                    </tr>

                    <tr>
                        <td>Pedro H.</td>
                        <td>1°B</td>
                        <td>Biblioteca</td>
                        <td>10:02</td>
                        <td>Voltou</td>
                    </tr>

                    <tr>
                        <td>Ana L.</td>
                        <td>2°A</td>
                        <td>Setor Ped.</td>
                        <td>09:50</td>
                        <td>Voltou</td>
                    </tr>

                </tbody>

            </table>

        </section>


       
        <footer class="rodape">

            <a href="#" class="botao-voltar">Voltar</a>

        </footer>


        

    </main>


  

   
</body>

</html>
